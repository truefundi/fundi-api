                $ref: '#/components/schemas/HealthStatus'
      summary: API, database, and Redis health
      tags:
        - Health
      x-fundi-status: implemented
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer/technician access token from `POST /auth/verify-otp`.
    adminAccessToken:
      type: apiKey
      in: cookie
      name: fundi_admin_access
      description: 'Administrator access cookie set by `POST /auth/admin/2fa/verify`. Requires `credentials: include` on the browser.'
    adminRefreshToken:
      type: apiKey
      in: cookie
      name: fundi_admin_refresh
      description: 'Single-use refresh cookie set by `POST /auth/admin/2fa/verify` and rotated by `POST /auth/admin/refresh`.'
    adminTwoFactorChallenge:
      type: apiKey
      in: cookie
      name: fundi_admin_2fa_challenge
      description: 'Opaque pending-challenge cookie set by `POST /auth/admin/login` and consumed by `POST /auth/admin/2fa/verify`. Grants nothing on its own.'
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TechnicianId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Category:
      name: category
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 120
    CategoryIdQuery:
      name: categoryId
      in: query
      schema:
        type: string
        format: uuid
    Location:
      name: location
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
    MinYears:
      name: minYearsOfExperience
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 60
    TechnicianQueryText:
      name: query
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 120
  responses:
    ValidationError:
      description: Validation failed (400/422).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Wrong role or inactive account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Duplicate or conflicting state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Dependency unavailable (e.g. Redis).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        message:
          description: Human-readable text, or an array for validation failures.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        fieldErrors:
          description: Optional. Proposed additive field for per-field form errors.
          type: object
          additionalProperties:
            type: string
        requestId:
          description: Optional. Proposed additive field for support correlation.
          type: string
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    MessageWithUser:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        nextCursor:
          type:
            - string
            - 'null'
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
