      x-fundi-status: implemented
  /auth/admin/dev/verify:
    post:
      description: Issues the `fundi_admin_access` and `fundi_admin_refresh` cookies, exactly as `/2fa/verify` does. Answers `404` outside the development build.
      operationId: AdminAuthController_devVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDevOtpVerifyDto'
      responses:
        '200':
          description: An authenticated admin session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionDto'
        '400':
          description: The request failed validation. `message` is an array of per-field messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: The code is incorrect or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: The account is no longer an active administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: The dev-only sign-in is disabled outside development.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '503':
          description: Redis is unavailable, so the OTP could not be processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: 'DEV ONLY: exchange the OTP for an admin session'
      tags:
        - AuthAdmin
      x-fundi-status: implemented
  /auth/admin/refresh:
    post:
      description: Takes no body and no access token, because it is normally called after the short-lived access token has expired. The presented token is single use and is revoked as the new pair is issued.
      operationId: AdminAuthController_refresh
      responses:
        '200':
          description: A renewed admin session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionDto'
        '400':
          description: There is no session cookie to refresh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: The session is invalid, expired, or belongs to an account that is no longer an active administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '503':
          description: Redis is unavailable, so the OTP could not be processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - adminRefreshToken: []
      summary: Rotate the admin session cookies
      tags:
        - AuthAdmin
      x-fundi-status: implemented
  /auth/admin/logout:
    post:
      description: Revokes the stored session when the refresh cookie is present, and always clears all three cookies. Succeeds even when the refresh token is unknown, so the dashboard can never be left holding a session it cannot drop.
      operationId: AdminAuthController_logout
      responses:
        '200':
          description: The session was ended and the cookies cleared
      security:
        - adminRefreshToken: []
      summary: Revoke the admin session and clear cookies
      tags:
        - AuthAdmin
      x-fundi-status: implemented
