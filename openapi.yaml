  # ---------------------------------------------------------------------------
  /jobs:
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Create a service request
      description: >
        TARGET shape is JSON with pre-uploaded media (see `JobCreate`).
        IMPORTANT `needs-decision`: the live backend currently accepts
        `multipart/form-data` with `serviceCategoryId`, `otherServiceName`,
        `description`, `locationAddress`, `latitude`, `longitude`,
        `offeredAmount`, `priority`, plus `photos`/`video` file fields. The
        frontends want JSON. Pick one and update this operation.
      x-fundi-status: needs-decision
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        description: >
          `needs-decision`: the target shape is JSON (above). The live backend
          accepts multipart/form-data today, so both are documented until the
          team picks one.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCreate" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/JobCreateLegacyMultipart" }
      responses:
        "201":
          description: Created job.
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
