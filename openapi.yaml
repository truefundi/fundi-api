        - name: limit
          required: false
          in: query
          description: Rows per page, between 1 and 100. Defaults to 20.
          schema:
            minimum: 1
            maximum: 100
            default: 20
            example: 20
            type: integer
        - name: status
          required: false
          in: query
          description: Only return conversations in this negotiation state.
          schema:
            example: NEGOTIATING
            type: string
            enum:
              - NEGOTIATING
              - AGREED
              - DECLINED
              - EXPIRED
              - PENDING
        - name: search
          required: false
          in: query
          description: Substring matched against the service, problem, customer, and technician.
          schema:
            maxLength: 200
            example: HVAC
            type: string
      responses:
