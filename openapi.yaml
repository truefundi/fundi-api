        otherServiceName:
          type: string
          minLength: 2
          maxLength: 80
          description: Free-text service when the work does not fit a catalog category. Provide this or serviceCategoryId, not both.
          example: Solar water heater repair
        description:
          type: string
          minLength: 10
          maxLength: 5000
          description: What needs fixing, in the customer’s own words.
          example: The kitchen sink has been leaking under the cabinet since yesterday.
        locationAddress:
          type: string
          minLength: 3
          maxLength: 255
          description: Where the technician should go.
          example: Kimironko, Gasabo
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude of the job location. Used for dispatch distance.
          example: -1.9441
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude of the job location. Used for dispatch distance.
          example: 30.0619
        offeredAmount:
          type: integer
          minimum: 1
          maximum: 2000000000
          description: Amount the customer offers for the visit/repair, in the job currency (RWF).
          example: 20000
        priority:
          type: string
          enum:
            - LOW
            - NORMAL
            - HIGH
            - URGENT
          default: NORMAL
          description: How urgently the job should be dispatched.
        customerId:
          type: string
          format: uuid
          description: Active customer account to create the request for. The admin places the request on their behalf.
          example: e5a4f4d7-0b21-46d8-9a4b-98765d332100
