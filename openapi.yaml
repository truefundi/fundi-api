  /auth/refresh:
    post:
      description: Takes no access token, since the point is to renew after the old one expired. The supplied refresh token is single use and is revoked as the new pair is issued.
      operationId: AuthController_refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '200':
          description: A new token pair; the supplied refresh token is revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensDto'
        '400':
          description: The request failed validation. `message` is an array of per-field messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: The refresh token is invalid, expired, already used, or belongs to a deleted account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
