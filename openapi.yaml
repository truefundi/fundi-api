openapi: 3.1.0
info:
  title: Fundi API
  version: 1.0.0
  license:
    name: Proprietary
  description: |-
    Implemented Fundi backend contract for the web dashboard, mobile apps, and integrations.

    **Base URL:** `/api/v1` (set the client base URL to the origin only).

    **Two authentication modes:**
    - Customers and technicians: `Authorization: Bearer <accessToken>` from `POST /auth/verify-otp`.
    - Administrators: httpOnly session cookies set by `POST /auth/admin/2fa/verify`. Browser clients must send `credentials: include`.

    Every path in this document is implemented and mounted by the running backend. Endpoints that are only proposed are not listed.
servers:
  - url: /api/v1
    description: Versioned API path.
tags:
  - name: Admin conversations
    description: Read-only administrator conversation oversight.
  - name: Admin disputes
    description: Administrator dispute review and resolution.
  - name: AdminDashboard
  - name: AdminJobs
  - name: Auth
  - name: AuthAdmin
  - name: Catalog
    description: Service categories, their groups, descriptions, and booking fees.
  - name: Conversations
    description: Customer/technician price negotiation and messaging.
  - name: Disputes
    description: Customer and technician dispute intake.
  - name: Health
  - name: Jobs
  - name: Notifications
    description: In-app notification inbox and read state.
  - name: TechnicianJobs
  - name: Technicians
    description: Technician self-service profile, availability, and discovery.
  - name: Users
security: []
paths:
  /jobs:
    post:
      operationId: JobsController_create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - description
                - locationAddress
                - latitude
                - longitude
                - offeredAmount
              properties:
                serviceCategoryId:
                  type: string
                  format: uuid
                otherServiceName:
                  type: string
                  maxLength: 80
                description:
                  type: string
                  minLength: 10
                  maxLength: 5000
                locationAddress:
                  type: string
                  maxLength: 255
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                offeredAmount:
                  type: integer
                  minimum: 1
                  description: Amount in RWF
                priority:
                  type: string
                  enum:
                    - LOW
                    - NORMAL
                    - HIGH
                    - URGENT
                photos:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
                video:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          $ref: '#/components/responses/ValidationError'
          description: Successful response.
      security:
        - bearerAuth: []
      tags:
        - Jobs
      summary: Create a service request
      description: |
        TARGET shape is JSON with pre-uploaded media (see `JobCreate`). IMPORTANT `needs-decision`: the live backend currently accepts `multipart/form-data` with `serviceCategoryId`, `otherServiceName`, `description`, `locationAddress`, `latitude`, `longitude`, `offeredAmount`, `priority`, plus `photos`/`video` file fields. The frontends want JSON. Pick one and update this operation.
      x-fundi-status: implemented
  /jobs/mine:
    get:
      operationId: JobsController_listMine
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfJob'
      security:
        - bearerAuth: []
      tags:
        - Jobs
      summary: List my jobs
      description: |
        `needs-decision`: the live backend returns a bare array here. The agreed pagination envelope is `PageOfJob`. Align the response.
      x-fundi-status: implemented
  /jobs/mine/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: JobsController_getMine
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Successful response.
      security:
        - bearerAuth: []
      tags:
        - Jobs
      summary: Read one of my jobs
      x-fundi-status: implemented
    patch:
      operationId: JobsController_updateMine
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobDto'
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - bearerAuth: []
      tags:
        - Jobs
      summary: Edit an open, unassigned job
      x-fundi-status: implemented
    delete:
      operationId: JobsController_cancel
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The resulting job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - bearerAuth: []
      tags:
        - Jobs
      summary: Cancel an open, unassigned job
      x-fundi-status: implemented
  /jobs/mine/{jobId}/progress:
    patch:
      operationId: JobsController_updateProgress
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobProgressDto'
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - bearerAuth: []
      tags:
        - Jobs
      summary: Update my side's progress
      x-fundi-status: implemented
  /jobs/mine/{jobId}/retry-dispatch:
    post:
      operationId: JobsController_retryDispatch
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - bearerAuth: []
      tags:
        - Jobs
      summary: Retry matching after the offer list is exhausted
      x-fundi-status: implemented
  /jobs/mine/{jobId}/accept:
    post:
      operationId: JobsController_acceptTechnicianOffer
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - bearerAuth: []
      tags:
        - Jobs
      summary: Customer accepts a technician offer
      x-fundi-status: implemented
  /jobs/mine/{jobId}/media:
    post:
      operationId: JobsController_addMedia
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
                video:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - bearerAuth: []
      tags:
        - Jobs
      summary: Add attachments to an open job
      x-fundi-status: implemented
  /jobs/mine/{jobId}/media/{mediaId}:
    delete:
      operationId: JobsController_deleteMedia
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
        - name: mediaId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - bearerAuth: []
      tags:
        - Jobs
      summary: Remove an attachment from an open job
      x-fundi-status: implemented
  /jobs/technician/offers:
    get:
      operationId: TechnicianJobsController_listOffers
      responses:
        '200':
          description: Offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfOffer'
      security:
        - bearerAuth: []
      tags:
        - TechnicianJobs
      summary: List current offers and my offer history
      x-fundi-status: implemented
  /jobs/technician/offers/{offerId}/accept:
    post:
      operationId: TechnicianJobsController_acceptOffer
      parameters:
        - name: offerId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The assigned job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - bearerAuth: []
      tags:
        - TechnicianJobs
      summary: Accept the current offer
      x-fundi-status: implemented
  /jobs/technician/offers/{offerId}/reject:
    post:
      operationId: TechnicianJobsController_rejectOffer
      parameters:
        - name: offerId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectJobOfferDto'
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
      security:
        - bearerAuth: []
      tags:
        - TechnicianJobs
      summary: Reject the current offer
      x-fundi-status: implemented
  /jobs/technician/mine:
    get:
      operationId: TechnicianJobsController_listMine
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfJob'
      security:
        - bearerAuth: []
      tags:
        - TechnicianJobs
      summary: List my assigned and past jobs
      x-fundi-status: implemented
  /jobs/technician/mine/{jobId}:
    get:
      operationId: TechnicianJobsController_getMine
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - bearerAuth: []
      tags:
        - TechnicianJobs
      summary: Get a job assigned to me
      x-fundi-status: implemented
  /jobs/technician/mine/{jobId}/progress:
    patch:
      operationId: TechnicianJobsController_updateProgress
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobProgressDto'
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - bearerAuth: []
      tags:
        - TechnicianJobs
      summary: Update my side's progress
      x-fundi-status: implemented
  /jobs/technician/mine/{jobId}/drop:
    post:
      operationId: TechnicianJobsController_drop
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DropJobDto'
      responses:
        '200':
          description: Dropped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
      security:
        - bearerAuth: []
      tags:
        - TechnicianJobs
      summary: Drop an assigned job with a reason
      x-fundi-status: implemented
  /admin/jobs:
    get:
      operationId: AdminJobsController_list
      responses:
        '200':
          description: One page of jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfJob'
      security:
        - adminAccessToken: []
      tags:
        - AdminJobs
      summary: List all jobs
      description: |
        `needs-decision`: the live backend returns a bare array. The dashboard expects `{ items, total, page, pageSize }`. Align on `PageOfJob`.
      x-fundi-status: implemented
    post:
      description: 'Creates the request on an active customer’s behalf. The job is dispatched like a customer request: matching technicians receive offers immediately.'
      operationId: AdminJobsController_create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateJobDto'
      responses:
        '201':
          description: Created job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - adminAccessToken: []
      summary: Create a job on behalf of a customer (admin)
      tags:
        - AdminJobs
      x-fundi-status: implemented
  /admin/jobs/summary:
    get:
      description: Counts active (OPEN or ASSIGNED) and COMPLETED jobs, plus disputes that have no resolution yet.
      operationId: AdminJobsController_summary
      responses:
        '200':
          description: Job counts for the admin dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSummaryResponseDto'
      security:
        - adminAccessToken: []
      summary: Dashboard job counts
      tags:
        - AdminJobs
      x-fundi-status: implemented
  /admin/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: AdminJobsController_get
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - adminAccessToken: []
      tags:
        - AdminJobs
      summary: Get full job details (admin)
      x-fundi-status: implemented
    patch:
      description: An unassigned OPEN job is re-matched after the change. Once a technician is assigned the job stays with them and its fields are corrected in place.
      operationId: AdminJobsController_update
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobDto'
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - adminAccessToken: []
      summary: Edit a job (admin)
      tags:
        - AdminJobs
      x-fundi-status: implemented
    delete:
      description: Removes a mistaken or duplicate job and its stored media. Assigned and completed jobs must be cancelled instead so their record stays traceable.
      operationId: AdminJobsController_remove
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
      security:
        - adminAccessToken: []
      summary: Delete a mistaken/duplicate job (admin)
      tags:
        - AdminJobs
      x-fundi-status: implemented
  /admin/jobs/{jobId}/cancel:
    post:
      description: Cancels an OPEN or ASSIGNED job, withdraws pending offers, closes the assignment, and declines any open negotiation with the reason kept on the job.
      operationId: AdminJobsController_cancel
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCancelJobDto'
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - adminAccessToken: []
      summary: Cancel a job as admin
      tags:
        - AdminJobs
      x-fundi-status: implemented
  /admin/jobs/{jobId}/reassign:
    post:
      description: Moves an OPEN or ASSIGNED job to an approved, active technician. The previous assignment ends, pending offers are withdrawn, and progress restarts.
      operationId: AdminJobsController_reassign
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReassignJobDto'
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      security:
        - adminAccessToken: []
      summary: Reassign/set the technician on a job (admin)
      tags:
        - AdminJobs
      x-fundi-status: implemented
  /admin/jobs/{jobId}/rating:
    post:
      description: Records the customer’s post-job rating on their behalf. All six categories are whole stars from 1 to 5.
      operationId: AdminJobsController_rate
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRateJobDto'
      responses:
        '201':
          description: The rated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
        - adminAccessToken: []
      summary: Rate a job (admin only)
      tags:
        - Admin jobs
      x-fundi-status: implemented
  /jobs/{jobId}/media/{mediaId}:
    get:
      operationId: JobMediaController_download
      parameters:
        - name: jobId
          required: true
          in: path
          schema:
            type: string
        - name: mediaId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The file bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      security:
        - bearerAuth: []
        - adminAccessToken: []
      tags:
        - Jobs
      summary: Download job media (file bytes)
      x-fundi-status: implemented
  /notifications:
    get:
      operationId: NotificationsController_list
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: offset
          required: false
          in: query
          schema:
            minimum: 0
            default: 0
            type: number
        - name: unreadOnly
          required: false
          in: query
          description: Only return unread notifications
          schema:
            type: boolean
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfNotification'
      security:
        - bearerAuth: []
        - adminAccessToken: []
      tags:
        - Notifications
      summary: List my notifications
      x-fundi-status: implemented
  /notifications/unread-count:
    get:
      operationId: NotificationsController_unreadCount
      responses:
        '200':
          description: Number of unread notifications.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    example: 3
      security:
        - bearerAuth: []
        - adminAccessToken: []
      tags:
        - Notifications
      summary: Count my unread notifications
      x-fundi-status: implemented
  /notifications/read-all:
    patch:
      operationId: NotificationsController_markAllRead
      responses:
        '200':
          description: Number of notifications marked read.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
                    example: 3
      security:
        - bearerAuth: []
        - adminAccessToken: []
      tags:
        - Notifications
      summary: Mark every notification read
      x-fundi-status: implemented
  /notifications/{notificationId}/read:
    patch:
      operationId: NotificationsController_markRead
      parameters:
        - name: notificationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The updated notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        - adminAccessToken: []
      tags:
        - Notifications
      summary: Mark one notification read
      x-fundi-status: implemented
  /auth/register:
    post:
      description: Creates the account and sends the first OTP. The account is not usable until `/verify-otp` succeeds. `ADMIN` cannot be requested here.
      operationId: AuthController_register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '400':
          description: The request failed validation. `message` is an array of per-field messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: An account with this phone number or email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '503':
          description: The OTP could not be stored, so the account was not started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Start registration; returns a message and sends an OTP
      tags:
        - Auth
      x-fundi-status: implemented
  /auth/login:
    post:
      description: Only starts a login for an account that already exists and is active. The code expires in five minutes.
      operationId: AuthController_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneDto'
      responses:
        '400':
          description: The request failed validation. `message` is an array of per-field messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: This account is not active. Please contact the administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: No account was found for this phone number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '503':
          description: Redis is unavailable, so the OTP could not be processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Start login verification by phone number
      tags:
        - Auth
      x-fundi-status: implemented
  /auth/resend-otp:
    post:
      description: Replaces the pending code and resets the attempt counter, but keeps the resend budget for the same pending OTP. Requires an OTP already in flight.
      operationId: AuthController_resendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneDto'
      responses:
        '400':
          description: |-
            There is no pending OTP, or the three-resend limit has been reached.

            The request failed validation. `message` is an array of per-field messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: This account is not active. Please contact the administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: No account was found for this phone number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '503':
          description: Redis is unavailable, so the OTP could not be processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Resend the pending OTP (max 3 times)
      tags:
        - Auth
      x-fundi-status: implemented
  /auth/verify-otp:
    post:
      description: Consumes the pending code and issues a token pair. Five incorrect guesses lock verification for that account for fifteen minutes, during which even the correct code is refused.
      operationId: AuthController_verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpDto'
      responses:
        '200':
          description: A token pair for the verified account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensDto'
        '400':
          description: |-
            No OTP is pending. Request a new login OTP.

