# =============================================================================
# Fundi API — shared contract 
# =============================================================================
openapi: 3.1.0
info:
  title: Fundi API
  version: 0.2.0-draft
  license:
    name: Proprietary
  description: |
    Shared openapi contract for Fundi mobile, web, and backend. 
x-fundi-open-decisions:
  - id: job-status-model
    summary: >-
      The frontends use one flat 19-value `status` (REQUESTED..DISPUTED).
      The backend stores `status` (OPEN/ASSIGNED/COMPLETED/FAILED),
      `dispatchStatus`, `customerProgress`, and `technicianProgress`.
    proposal: >-
      Keep the backend's granular fields as the source of truth and have the
      server RETURN a derived `status` using the frontends' 19-value vocabulary.
      Frontends render `status`; they stop inventing lifecycle states locally.
  - id: job-create-transport
    summary: Backend `POST /jobs` is multipart/form-data; frontends expect JSON.
    proposal: >-
      Move to JSON with uploaded media referenced by id/URL (see `JobCreate`),
      using the existing `/uploads` flow, OR keep multipart and document it as
      the one exception. Pick one.
  - id: field-naming
    summary: >-
      Mobile/web say `problem` and `location.label`; backend persists
      `description` and `location.address`.
    proposal: Adopt `description` and `location.address` on the wire; map in clients.
  - id: urgency-vs-priority
    summary: >-
      Frontends use urgency `Emergency|Today|Schedule`; backend uses priority
      `LOW|NORMAL|HIGH|URGENT`.
    proposal: Keep `priority` on the wire; map Emergency->URGENT, Today->HIGH, Schedule->NORMAL.
  - id: worker-route-names
    summary: >-
      Mobile proposed `/worker/*`; backend implemented `/technicians/*` and
      `/jobs/technician/*`.
    proposal: Keep the backend's `/technicians/*` + `/jobs/technician/*` names.
  - id: customer-job-route-names
    summary: >-
      Mobile proposed customer actions as `/jobs/{jobId}/accept` etc.; the
      backend already ships `/jobs/mine/:jobId/...`.
    proposal: >-
      Keep customer job routes under `/jobs/mine/{jobId}/...` (used in this
      contract). It stays consistent with the shipped API and avoids ambiguity
      with `/jobs/{jobId}`.
  - id: pagination
    summary: >-
      Three conventions exist: backend arrays (`/jobs/mine`), backend
      `{data,pagination}`, and the mobile `{items,nextCursor}` / web
      `{items,total,page,pageSize}`.
    proposal: >-
      One envelope `{ items, page, pageSize, total, nextCursor? }` on every list
      endpoint, including `/jobs/mine`, `/admin/jobs`, and notifications.
  - id: error-body
    summary: >-
      Mobile proposed RFC7807 (`type/title/status/detail/fieldErrors/requestId`);
      backend returns `statusCode/timestamp/path/message`.
    proposal: >-
      Keep the backend shape (already shipped) and add optional `fieldErrors`
      and `requestId` to it. Frontends read `message`.
  - id: mobile-registration-role
    summary: >-
      MOBILE_BACKEND_INTEGRATION.md register example omits `role`, but the
      backend defaults to CUSTOMER, so technicians cannot self-register.
    proposal: 'Mobile must send `role: "TECHNICIAN"` when a technician signs up.'
servers:
  - url: /api/v1
    description: Versioned API path. Set the client base URL to the origin only.
tags:
  - name: Health
    description: Liveness and dependency checks.
  - name: Auth
    description: Phone + OTP authentication for customers and technicians (bearer JWTs).
  - name: AuthAdmin
    description: Administrator email + password + TOTP authentication (httpOnly cookie session).
  - name: Users
    description: Account records and the current user's profile.
  - name: Catalog
    description: Service categories used by job requests and technician services.
  - name: Technicians
    description: Technician profiles, verification, documents, discovery, and admin management.
  - name: Jobs
    description: Customer service requests and their lifecycle actions.
  - name: TechnicianJobs
    description: Offers and assigned work for technicians.
  - name: AdminJobs
    description: Administrator job oversight.
  - name: AdminDashboard
    description: Dashboard aggregates.
  - name: Notifications
    description: User notifications. Proposed.
  - name: Payments
    description: Payments and invoices. Proposed.
  - name: Uploads
    description: Generic presigned upload flow. Proposed.
security: []

paths:
  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: API, database, and Redis health
      security: []
      x-fundi-status: implemented
      responses:
        "200":
          description: Health status. `status` is `ok` or `degraded`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ---------------------------------------------------------------------------
  # Auth — phone + OTP (customers, technicians)
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Start registration; returns a message and sends an OTP
      security: []
      x-fundi-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: OTP generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageWithUser" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Start login verification by phone number
      security: []
      x-fundi-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneRequest" }
      responses:
        "200":
          description: OTP generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/resend-otp:
    post:
      tags: [Auth]
      operationId: resendOtp
      summary: Resend the pending OTP (max 3 times)
      security: []
      x-fundi-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneRequest" }
      responses:
        "200":
          description: OTP resent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /auth/verify-otp:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify the 6-digit OTP and receive a token pair
      security: []
      x-fundi-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyOtpRequest" }
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Exchange a single-use refresh token for a new pair
      security: []
      x-fundi-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the refresh session
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Read the authenticated account
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------------------
  # Auth — admin (email + password + TOTP, cookie session)
  # ---------------------------------------------------------------------------
  /auth/admin/login:
    post:
      tags: [AuthAdmin]
      operationId: adminLogin
      summary: Step one — verify email and password, set the 2FA challenge cookie
      security: []
      x-fundi-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginRequest" }
      responses:
        "200":
          description: Challenge created. Send the TOTP code to `/auth/admin/2fa/verify`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLoginChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/admin/2fa/verify:
    post:
      tags: [AuthAdmin]
      operationId: adminVerify2fa
      summary: Step two — verify the authenticator code, set session cookies
      security: []
      x-fundi-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Session established as httpOnly cookies (no tokens in the body).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/admin/refresh:
    post:
      tags: [AuthAdmin]
      operationId: adminRefresh
      summary: Rotate the admin session cookies
      security: []
      x-fundi-status: implemented
      responses:
        "200":
          description: Refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/admin/logout:
    post:
      tags: [AuthAdmin]
      operationId: adminLogout
      summary: Revoke the admin session and clear cookies
      security: []
      x-fundi-status: implemented
      responses:
        "200": { description: "Always 200, even with no session." }
  /auth/admin/me:
    get:
      tags: [AuthAdmin]
      operationId: adminMe
      summary: Read the signed-in administrator
      x-fundi-status: implemented
      security: [{ adminCookie: [] }]
      responses:
        "200":
          description: The current admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminIdentity" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------------------
  # Users
  # ---------------------------------------------------------------------------
  /users/me:
    get:
      tags: [Users]
      operationId: getMyUser
      summary: Read my user record
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current user.
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
    patch:
      tags: [Users]
      operationId: updateMyUser
      summary: Update my profile (bearer only, never the admin cookie)
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated user.
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
    delete:
      tags: [Users]
      operationId: deleteMyUser
      summary: Delete my account
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Deleted.
          content: { application/json: { schema: { $ref: "#/components/schemas/MessageResponse" } } }
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List accounts (admin)
      x-fundi-status: implemented
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AccountStatus" }
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageOfUser" }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create an account (admin)
      x-fundi-status: implemented
      security: [{ adminCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created.
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
  /users/search:
    get:
      tags: [Users]
      operationId: searchUsers
      summary: Search users by phone/name/email (admin)
      x-fundi-status: implemented
      security: [{ adminCookie: [] }]
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
  /users/by-email:
    get:
      tags: [Users]
      operationId: getUserByEmail
      summary: Find one user by email (admin)
      x-fundi-status: implemented
      security: [{ adminCookie: [] }]
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: The user.
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user by ID (admin)
      x-fundi-status: implemented
      security: [{ adminCookie: [] }]
      responses:
        "200":
          description: The user.
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user (admin)
      x-fundi-status: implemented
      security: [{ adminCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateUserRequest" }
      responses:
        "200":
          description: Updated user.
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user (admin)
      x-fundi-status: implemented
      security: [{ adminCookie: [] }]
      responses:
        "200":
          description: Deleted.
          content: { application/json: { schema: { $ref: "#/components/schemas/MessageResponse" } } }
  /users/{id}/status:
    patch:
      tags: [Users]
      operationId: setUserStatus
      summary: Set a user's account status (admin)
      x-fundi-status: implemented
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/AccountStatus" }
      responses:
        "200":
          description: Updated user.
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }

  # ---------------------------------------------------------------------------
  # Catalog
  # ---------------------------------------------------------------------------
  /catalog/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: List active service categories (public)
      security: []
      x-fundi-status: implemented
      responses:
        "200":
          description: Active categories.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ServiceCategory" } }
    post:
      tags: [Catalog]
      operationId: createCategory
      summary: Create a category (admin)
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryWrite" }
      responses:
        "201":
          description: Created.
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceCategoryFull" } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /catalog/categories/search:
    get:
      tags: [Catalog]
      operationId: searchCategories
      summary: Search active categories by name (public)
      security: []
      x-fundi-status: implemented
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Matching categories.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ServiceCategory" } }
  /catalog/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Catalog]
      operationId: getCategory
      summary: Get an active category (public)
      security: []
      x-fundi-status: implemented
      responses:
        "200":
          description: The category.
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceCategory" } } }
    patch:
      tags: [Catalog]
      operationId: updateCategory
      summary: Update a category (admin)
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryWrite" }
      responses:
        "200":
          description: Updated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceCategoryFull" } } }
    delete:
      tags: [Catalog]
      operationId: deactivateCategory
      summary: Deactivate a category (admin)
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Deactivated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  category: { $ref: "#/components/schemas/ServiceCategoryFull" }
  /catalog/admin/categories:
    get:
      tags: [Catalog]
      operationId: listAllCategories
      summary: List active and inactive categories (admin)
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: All categories.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ServiceCategoryFull" } }
  /catalog/admin/categories/{id}:
    get:
      tags: [Catalog]
      operationId: getAnyCategory
      summary: Get any category including inactive (admin)
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: The category.
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceCategoryFull" } } }
  /catalog/admin/categories/by-name:
    get:
      tags: [Catalog]
      operationId: getCategoryByName
      summary: Find a category by exact name (admin)
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The category.
          content: { application/json: { schema: { $ref: "#/components/schemas/ServiceCategoryFull" } } }

  # ---------------------------------------------------------------------------
  # Technicians — self-service
  # ---------------------------------------------------------------------------
  /technicians/profile:
    get:
      tags: [Technicians]
      operationId: getMyTechnicianProfile
      summary: Read my technician profile
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: My profile.
          content: { application/json: { schema: { $ref: "#/components/schemas/TechnicianProfile" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Technicians]
      operationId: createMyTechnicianProfile
      summary: Register my technician profile (first time)
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TechnicianProfileCreate" }
      responses:
        "201":
          description: 'Created with `verificationStatus: PENDING`, `availabilityStatus: OFFLINE`.'
          content: { application/json: { schema: { $ref: "#/components/schemas/TechnicianProfile" } } }
        "409": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [Technicians]
      operationId: updateMyTechnicianProfile
      summary: Update my technician profile
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TechnicianProfileUpdate" }
      responses:
        "200":
          description: Updated profile.
          content: { application/json: { schema: { $ref: "#/components/schemas/TechnicianProfile" } } }
  /technicians/availability:
    patch:
      tags: [Technicians]
      operationId: setMyAvailability
      summary: Go online/offline (online requires APPROVED + ACTIVE)
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availabilityStatus]
              properties:
                availabilityStatus: { $ref: "#/components/schemas/AvailabilityStatus" }
      responses:
        "200":
          description: Updated profile.
          content: { application/json: { schema: { $ref: "#/components/schemas/TechnicianProfile" } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /technicians/profile/picture:
    put:
      tags: [Technicians]
      operationId: uploadProfilePicture
      summary: Upload/replace the profile picture
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Updated profile.
          content: { application/json: { schema: { $ref: "#/components/schemas/TechnicianProfile" } } }
    delete:
      tags: [Technicians]
      operationId: deleteProfilePicture
      summary: Remove the profile picture
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Updated profile.
          content: { application/json: { schema: { $ref: "#/components/schemas/TechnicianProfile" } } }
  /technicians/profile/documents:
    get:
      tags: [Technicians]
      operationId: listMyDocuments
      summary: List my verification documents
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: My documents.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Document" } }
    post:
      tags: [Technicians]
      operationId: uploadDocument
      summary: Upload a National ID or certificate document
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type, title]
              properties:
                file: { type: string, format: binary }
                type: { $ref: "#/components/schemas/DocumentType" }
                title: { type: string }
                certificateType: { $ref: "#/components/schemas/CertificateType" }
                categoryId: { type: string, format: uuid }
                customCategoryName: { type: string }
      responses:
        "201":
          description: Created document.
          content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /technicians/profile/documents/{documentId}:
    delete:
      tags: [Technicians]
      operationId: deleteMyDocument
      summary: Delete a SUBMITTED or DENIED document of mine
      x-fundi-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Deleted.
          content: { application/json: { schema: { $ref: "#/components/schemas/MessageResponse" } } }
        "409": { $ref: "#/components/responses/Conflict" }
