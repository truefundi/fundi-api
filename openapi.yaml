        '401':
          description: The access token is missing, expired, or revoked, or the refresh token does not belong to this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: The account is no longer active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - bearerAuth: []
      summary: Revoke the refresh session
      tags:
        - Auth
      x-fundi-status: implemented
  /auth/admin/login:
    post:
      description: |-
        On success no token is issued. A two-factor challenge cookie is set and the code from the authenticator app must be submitted to `/2fa/verify` before any protected route will answer.

        Returns `enrollmentRequired: true` with an `otpauthUri` and `secret` on the very first sign-in of an account, which is what the dashboard renders as a QR code. Once an authenticator is enrolled it returns `enrollmentRequired: false` and only asks for the code.

        The secret is returned so a client that cannot scan can type it in. It is sent with `Cache-Control: no-store` and is stored only after a first code is accepted, so a sign-in that is abandoned leaves nothing behind.

        Every credential failure answers `401` with the same message, so this endpoint cannot be used to discover which addresses belong to an administrator.
      operationId: AdminAuthController_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginDto'
      responses:
        '200':
          description: Password accepted, waiting on the authenticator
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AdminTwoFactorEnrollDto'
                  - $ref: '#/components/schemas/AdminTwoFactorRequiredDto'
        '400':
          description: The request failed validation. `message` is an array of per-field messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: The email or password is incorrect, or the account is not an active administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: Too many failed sign-in attempts for this address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '503':
          description: The rate-limit store or the secret store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Step one — verify email and password, set the 2FA challenge cookie
      tags:
        - AuthAdmin
      x-fundi-status: implemented
  /auth/admin/2fa/verify:
    post:
      description: |-
        The only step that issues tokens. The access and refresh tokens are set as httpOnly cookies and are never included in the response body, so nothing on the page can read them.

        On a first sign-in the same request confirms the enrolment, which is what commits the secret to the account. Submitting a correct code consumes it: replaying it answers `400`, so one code is worth at most one session.
      operationId: AdminAuthController_verifyTwoFactor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAdminTwoFactorDto'
      responses:
        '200':
          description: An authenticated admin session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionDto'
        '400':
          description: There is no pending verification, or the challenge was already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: The code is incorrect, or the sign-in window has closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: The account is no longer an active administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: Too many incorrect codes were submitted for this account. Wait a few minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '503':
          description: Redis is unavailable, so the OTP could not be processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - adminTwoFactorChallenge: []
      summary: Step two — verify the authenticator code, set session cookies
      tags:
        - AuthAdmin
      x-fundi-status: implemented
  /auth/admin/dev/otp:
    post:
      description: Returns the code in the response instead of sending it, so no phone is needed. Only the development build serves this route; every other environment answers `404`, as if it did not exist.
      operationId: AdminAuthController_devOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDevOtpRequestDto'
      responses:
        '200':
          description: The code to submit to `/dev/verify`
        '400':
