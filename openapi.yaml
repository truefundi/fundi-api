components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer/technician access token from `/auth/verify-otp`.
    adminCookie:
      type: apiKey
      in: cookie
      name: fundi_admin_access
      description: >
        Administrator session cookie set by `/auth/admin/2fa/verify`. Requires
        `credentials: include` on the browser and an HTTPS origin in production.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TechnicianId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Category:
      name: category
      in: query
      schema: { type: string, minLength: 1, maxLength: 120 }
    CategoryIdQuery:
      name: categoryId
      in: query
      schema: { type: string, format: uuid }
    Location:
      name: location
      in: query
      schema: { type: string, minLength: 1, maxLength: 200 }
    MinYears:
      name: minYearsOfExperience
      in: query
      schema: { type: integer, minimum: 0, maximum: 60 }
    TechnicianQueryText:
      name: query
      in: query
      schema: { type: string, minLength: 1, maxLength: 120 }

  responses:
    ValidationError:
      description: Validation failed (400/422).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Wrong role or inactive account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Duplicate or conflicting state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Dependency unavailable (e.g. Redis).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # --- Shared -------------------------------------------------------------
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        timestamp: { type: string, format: date-time }
        path: { type: string }
        message:
          description: Human-readable text, or an array for validation failures.
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        fieldErrors:
          description: Optional. Proposed additive field for per-field form errors.
          type: object
          additionalProperties: { type: string }
        requestId:
          description: Optional. Proposed additive field for support correlation.
          type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    MessageWithUser:
      type: object
      properties:
        message: { type: string }
        user: { $ref: "#/components/schemas/AuthUser" }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        nextCursor: { type: [string, "null"] }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded] }
        timestamp: { type: string, format: date-time }
        services:
          type: object
          properties:
            api: { type: string, enum: [up, down] }
            database: { type: string, enum: [up, down] }
            redis: { type: string, enum: [up, down] }
    Money:
      type: object
      description: Integer RWF, major units.
      required: [amount, currency]
      properties:
        amount: { type: integer }
        currency: { type: string, examples: [RWF] }

    # --- Enums --------------------------------------------------------------
    Role:
      type: string
      enum: [CUSTOMER, TECHNICIAN, ADMIN]
    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]
    VerificationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    AvailabilityStatus:
      type: string
      enum: [ONLINE, OFFLINE]
    Gender:
      type: string
      enum: [FEMALE, MALE, NON_BINARY, PREFER_NOT_TO_SAY]
    TechnicianPaymentMethod:
      type: string
      enum: [MOMO, BANK_TRANSFER, CASH, OTHER]
    Priority:
      type: string
      enum: [LOW, NORMAL, HIGH, URGENT]
    DispatchStatus:
      type: string
      enum: [PENDING, OFFERED, EXHAUSTED, STOPPED]
    ProgressStatus:
      type: string
      enum: [PENDING, STARTED, IN_PROGRESS, COMPLETED, FAILED]
    JobStatus:
      type: string
      description: >
        The AGREED frontend status vocabulary (mobile + web). The backend derives
        this from `dispatchStatus` + `customerProgress` + `technicianProgress`.
      enum:
        - REQUESTED
        - MATCHING
        - OFFERED
        - ACCEPTED
        - VISIT_PAID
        - EN_ROUTE
        - ARRIVED
        - DIAGNOSING
        - DIAGNOSIS_COMPLETE
        - QUOTE_PENDING
        - QUOTE_APPROVED
        - REPAIR_IN_PROGRESS
        - ADDITIONAL_APPROVAL_REQUIRED
        - REPAIR_COMPLETED
        - PAYMENT_PENDING
        - PAYMENT_REPORTED
        - COMPLETED
        - CANCELLED
        - DISPUTED
    CustomerPaymentMethod:
      type: string
      description: Proposed; not modelled by the backend yet.
      enum: [CARD, MOBILE_MONEY, FUNDI_WALLET]
    SettlementMethod:
      type: string
      enum: [FUNDI_GATEWAY, CASH, E_TRANSFER, OTHER]
    DocumentType:
      type: string
      enum: [NATIONAL_ID, CERTIFICATE]
    CertificateType:
      type: string
      enum: [TVET_CERTIFICATE, DIPLOMA, ADVANCED_DIPLOMA, DEGREE, SHORT_COURSE, OTHER]
    DocumentStatus:
      type: string
      enum: [SUBMITTED, REVIEWING, ACCEPTED, DENIED]
    MediaType:
      type: string
      enum: [PHOTO, VIDEO]
    NotificationType:
      type: string
      description: Proposed; extend as needed.
      enum: [JOB_UPDATE, OFFER, PAYMENT, VERIFICATION, SYSTEM]

    # --- Auth ---------------------------------------------------------------
    AuthUser:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        phoneNumber: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    AuthSession:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        accessToken: { type: string }
        refreshToken: { type: string }
    RegisterRequest:
      type: object
      required: [fullName, phoneNumber]
      properties:
        fullName: { type: string }
        phoneNumber: { type: string, examples: ["+250788123456"] }
        email: { type: [string, "null"], format: email }
        role:
          allOf: [{ $ref: "#/components/schemas/Role" }]
          description: Mobile MUST send TECHNICIAN for technician sign-up; defaults to CUSTOMER.
    PhoneRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber: { type: string }
    VerifyOtpRequest:
      type: object
      required: [phoneNumber, otp]
      properties:
        phoneNumber: { type: string }
        otp: { type: string, pattern: "^[0-9]{6}$" }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    AdminLoginChallenge:
      type: object
      required: [enrollmentRequired]
      properties:
        message: { type: string }
        enrollmentRequired: { type: boolean }
        expiresInSeconds: { type: integer }
        otpauthUri: { type: string }
        secret: { type: string }
    AdminIdentity:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN] }
    AdminSession:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AdminIdentity" }
        expiresInSeconds: { type: integer }

    # --- Users --------------------------------------------------------------
    User:
      type: object
      required: [id, fullName, phoneNumber, role, status]
      properties:
        id: { type: string }
        email: { type: [string, "null"], format: email }
        phoneNumber: { type: string }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [fullName, phoneNumber]
      properties:
        fullName: { type: string }
        phoneNumber: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/AccountStatus" }
    UpdateUserRequest:
      type: object
      properties:
        fullName: { type: string }
        phoneNumber: { type: string }
        email: { type: string, format: email }
    AdminUpdateUserRequest:
      type: object
      properties:
        fullName: { type: string }
        phoneNumber: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/AccountStatus" }
    PageOfUser:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/User" } }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }

    # --- Catalog ------------------------------------------------------------
    ServiceCategory:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    ServiceCategoryFull:
      allOf:
        - $ref: "#/components/schemas/ServiceCategory"
        - type: object
          properties:
            isActive: { type: boolean }
            createdAt: { type: string, format: date-time }
    CategoryWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        isActive: { type: boolean }

    # --- Technicians --------------------------------------------------------
    ServiceExperience:
      type: object
      properties:
        categoryId: { type: [string, "null"], format: uuid }
        category:
          oneOf:
            - { $ref: "#/components/schemas/ServiceCategory" }
            - { type: "null" }
        customName: { type: [string, "null"] }
        yearsOfExperience: { type: integer }
    TechnicianUser:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        role: { type: string, enum: [TECHNICIAN] }
        phoneNumber: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        status: { type: [string, "null"], enum: [ACTIVE, INACTIVE, SUSPENDED, null] }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
    TechnicianLocation:
      type: object
      properties:
        address: { type: [string, "null"] }
        publicLocationLabel: { type: [string, "null"] }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
    TechnicianProfile:
      type: object
      required: [id, user, verificationStatus, availabilityStatus]
      properties:
        id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/TechnicianUser" }
        gender: { oneOf: [{ $ref: "#/components/schemas/Gender" }, { type: "null" }] }
        yearsOfExperience: { type: integer }
        serviceExperiences:
          type: array
          items: { $ref: "#/components/schemas/ServiceExperience" }
        verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
        availabilityStatus: { $ref: "#/components/schemas/AvailabilityStatus" }
        location: { $ref: "#/components/schemas/TechnicianLocation" }
        profilePictureUrl: { type: [string, "null"] }
        nationalIdNumber: { type: [string, "null"] }
        paymentMethod:
          oneOf: [{ $ref: "#/components/schemas/TechnicianPaymentMethod" }, { type: "null" }]
        paymentNumber: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TechnicianProfileCreate:
      type: object
      required:
        [gender, nationalIdNumber, baseAddress, baseLatitude, baseLongitude, paymentMethod, paymentNumber, serviceExperiences]
      properties:
        fullName: { type: string }
        phoneNumber: { type: string }
        email: { type: string, format: email }
        gender: { $ref: "#/components/schemas/Gender" }
        nationalIdNumber: { type: string }
        baseAddress: { type: string }
        publicLocationLabel: { type: string }
        baseLatitude: { type: number }
        baseLongitude: { type: number }
        paymentMethod: { $ref: "#/components/schemas/TechnicianPaymentMethod" }
        paymentNumber: { type: string }
        serviceExperiences:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/ServiceExperienceInput" }
    ServiceExperienceInput:
      type: object
      required: [yearsOfExperience]
      properties:
        categoryId: { type: string, format: uuid }
        customName: { type: string }
        yearsOfExperience: { type: integer }
    TechnicianProfileUpdate:
      type: object
      description: >
        Any subset. Also accepts `availabilityStatus` and (admin only)
        `verificationStatus`. `serviceExperiences` replaces the whole list.
      properties:
        fullName: { type: string }
        phoneNumber: { type: string }
        email: { type: string, format: email }
        gender: { $ref: "#/components/schemas/Gender" }
        nationalIdNumber: { type: string }
        baseAddress: { type: string }
        publicLocationLabel: { type: string }
        baseLatitude: { type: number }
        baseLongitude: { type: number }
        paymentMethod: { $ref: "#/components/schemas/TechnicianPaymentMethod" }
        paymentNumber: { type: string }
        serviceExperiences:
          type: array
          items: { $ref: "#/components/schemas/ServiceExperienceInput" }
        availabilityStatus: { $ref: "#/components/schemas/AvailabilityStatus" }
        verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
    AdminTechnicianCreate:
      type: object
      required: [user, profile]
      properties:
        user:
          type: object
          required: [fullName, phoneNumber]
          properties:
            fullName: { type: string }
            phoneNumber: { type: string }
            email: { type: string, format: email }
        profile: { $ref: "#/components/schemas/TechnicianProfileCreate" }
    PageOfTechnician:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/TechnicianProfile" } }
        pagination: { $ref: "#/components/schemas/PaginationMeta" }
    Document:
      type: object
      properties:
        id: { type: string }
        technicianId: { type: string }
        type: { $ref: "#/components/schemas/DocumentType" }
        title: { type: string }
        certificateType: { oneOf: [{ $ref: "#/components/schemas/CertificateType" }, { type: "null" }] }
        categoryId: { type: [string, "null"] }
        category:
          oneOf: [{ $ref: "#/components/schemas/ServiceCategory" }, { type: "null" }]
        customCategoryName: { type: [string, "null"] }
        mimeType: { type: string }
        originalFileName: { type: string }
        sizeBytes: { type: integer }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        reviewNote: { type: [string, "null"] }
        reviewedAt: { type: [string, "null"], format: date-time }
        reviewedById: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VerificationChecklist:
      type: object
      properties:
        complete: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [PROFILE_PICTURE, NATIONAL_ID, CERTIFICATE] }
              label: { type: string }
              satisfied: { type: boolean }
              detail: { type: string }

    # --- Jobs ---------------------------------------------------------------
    Media:
      type: object
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/MediaType" }
        mimeType: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer }
        durationSeconds: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }
        downloadPath: { type: string }
        url: { type: [string, "null"] }
    QuoteLine:
      type: object
      required: [label, quantity, unitPrice]
      properties:
        label: { type: string }
        quantity: { type: integer }
        unitPrice: { type: integer }
    Quote:
      type: object
      required: [diagnosis, parts, labour]
      properties:
        diagnosis: { type: string }
        parts: { type: array, items: { $ref: "#/components/schemas/QuoteLine" } }
        labour: { type: integer }
        currency: { type: string, default: RWF }
    AdditionalWork:
      type: object
      properties:
        reason: { type: string }
        parts: { type: array, items: { $ref: "#/components/schemas/QuoteLine" } }
        labour: { type: integer }
    Rating:
      type: object
      required: [overall, quality, professionalism, arrival, communication, value]
      properties:
        overall: { type: number }
        quality: { type: integer }
        professionalism: { type: integer }
        arrival: { type: integer }
        communication: { type: integer }
        value: { type: integer }
        comment: { type: string }
    Payment:
      type: object
      properties:
        id: { type: string }
        jobId: { type: string }
        kind: { type: string, enum: [VISIT_FEE, REPAIR_SETTLEMENT] }
        amount: { $ref: "#/components/schemas/Money" }
        method: { type: string }
        status: { type: string, enum: [PENDING, REPORTED, PAID, FAILED, REFUNDED] }
        reference: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    JobEvent:
      type: object
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        title: { type: string }
        text: { type: string }
        at: { type: string, format: date-time }
    JobTechnicianRef:
      type: object
      description: Public/professional subset of a technician attached to a job.
      properties:
        id: { type: string }
        fullName: { type: string }
        yearsOfExperience: { type: integer }
        profilePictureUrl: { type: [string, "null"] }
    JobCustomerRef:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        phoneNumber: { type: [string, "null"] }
        email: { type: [string, "null"] }
    JobLocation:
      type: object
      properties:
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
    JobAssignment:
      type: object
      properties:
        technicianId: { type: string }
        technicianName: { type: string }
        acceptedAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        endReason: { type: [string, "null"] }
        reason: { type: [string, "null"] }
    Offer:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OFFERED, ACCEPTED, REJECTED, EXPIRED, DROPPED] }
        round: { type: integer }
        matchScore: { type: number }
        distanceMeters: { type: integer }
        offeredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        respondedAt: { type: [string, "null"], format: date-time }
        rejectionReason: { type: [string, "null"] }
        dropReason: { type: [string, "null"] }
        job: { $ref: "#/components/schemas/Job" }
    Job:
      type: object
      required: [id, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        reference: { type: string, examples: ["FND-4821"] }
        service: { type: string, description: "Display name; mirrors serviceCategory/custom." }
        serviceCategory:
          oneOf: [{ $ref: "#/components/schemas/ServiceCategory" }, { type: "null" }]
        otherServiceName: { type: [string, "null"] }
        description: { type: string, description: "web/mobile call this `problem`." }
        location: { $ref: "#/components/schemas/JobLocation" }
        offeredAmount: { type: integer }
        currency: { type: string, default: RWF }
        priority: { $ref: "#/components/schemas/Priority" }
        status:
          allOf: [{ $ref: "#/components/schemas/JobStatus" }]
          description: Derived by the server from the progress/dispatch fields.
        statusSince: { type: string, format: date-time }
        dispatchStatus: { $ref: "#/components/schemas/DispatchStatus" }
        customerProgress: { $ref: "#/components/schemas/ProgressStatus" }
        technicianProgress: { $ref: "#/components/schemas/ProgressStatus" }
        assignedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        visitFee:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        media: { type: array, items: { $ref: "#/components/schemas/Media" } }
        currentTechnician:
          oneOf: [{ $ref: "#/components/schemas/JobTechnicianRef" }, { type: "null" }]
        customer:
          oneOf: [{ $ref: "#/components/schemas/JobCustomerRef" }, { type: "null" }]
        assignmentHistory:
          type: array
          items: { $ref: "#/components/schemas/JobAssignment" }
        offers:
          description: Admin view only.
          type: array
          items: { $ref: "#/components/schemas/Offer" }
        quote:
          oneOf: [{ $ref: "#/components/schemas/Quote" }, { type: "null" }]
        additionalWork:
          oneOf: [{ $ref: "#/components/schemas/AdditionalWork" }, { type: "null" }]
        additionalWorkApproved: { type: [boolean, "null"] }
        settlementMethod:
          oneOf: [{ $ref: "#/components/schemas/SettlementMethod" }, { type: "null" }]
        rating:
          oneOf: [{ $ref: "#/components/schemas/Rating" }, { type: "null" }]
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        events:
          type: array
          items: { $ref: "#/components/schemas/JobEvent" }
    JobCreate:
      type: object
      required: [description, location, priority]
      properties:
        serviceCategoryId: { type: string, format: uuid }
        otherServiceName: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        location: { $ref: "#/components/schemas/JobLocation" }
        priority: { $ref: "#/components/schemas/Priority" }
        offeredAmount: { type: integer, minimum: 1 }
        scheduledFor: { type: [string, "null"], format: date-time }
        mediaIds:
          description: IDs returned by `/uploads/complete` (replaces inline file upload).
          type: array
          items: { type: string }
        customerId:
          description: Admin onboarding only.
          type: string
          format: uuid
    JobUpdate:
      type: object
      properties:
        serviceCategoryId: { type: string, format: uuid }
        otherServiceName: { type: string }
        description: { type: string }
        location: { $ref: "#/components/schemas/JobLocation" }
        priority: { $ref: "#/components/schemas/Priority" }
        offeredAmount: { type: integer }
    JobCreateLegacyMultipart:
      type: object
      description: The live backend shape. Kept for reference during the decision.
      properties:
        serviceCategoryId: { type: string }
        otherServiceName: { type: string }
        description: { type: string }
        locationAddress: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        offeredAmount: { type: integer }
        priority: { $ref: "#/components/schemas/Priority" }
        photos: { type: array, items: { type: string, format: binary } }
        video: { type: string, format: binary }
    ProgressUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ProgressStatus" }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    VisitFeePaymentRequest:
      type: object
      required: [paymentMethod]
      properties:
        paymentMethod: { $ref: "#/components/schemas/CustomerPaymentMethod" }
        paymentReference: { type: string }
    SettlementReportRequest:
      type: object
      required: [method, amount]
      properties:
        method: { $ref: "#/components/schemas/SettlementMethod" }
        amount: { type: integer }
        reference: { type: [string, "null"] }
    PageOfJob:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        nextCursor: { type: [string, "null"] }
    PageOfOffer:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Offer" } }
        nextCursor: { type: [string, "null"] }
    PageOfJobEvent:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/JobEvent" } }
        nextCursor: { type: [string, "null"] }
    JobSummary:
      type: object
      properties:
        active: { type: integer }
        completed: { type: integer }
        openDisputes: { type: [integer, "null"] }
    AdminStats:
      type: object
      properties:
        totalUsers: { type: integer }
        totalCustomers: { type: integer }
        totalTechnicians: { type: integer }
        pendingVerifications: { type: integer }
        suspendedAccounts: { type: integer }

    # --- Notifications / tracking / payments / uploads ----------------------
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/NotificationType" }
        title: { type: string }
        body: { type: string }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        jobId: { type: [string, "null"] }
    PageOfNotification:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        nextCursor: { type: [string, "null"] }
    Tracking:
      type: object
      properties:
        jobId: { type: string }
        technicianId: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        distanceKm: { type: number }
        etaMinutes: { type: integer }
        updatedAt: { type: string, format: date-time }
    Earnings:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        currency: { type: string, default: RWF }
        totalEarned: { type: integer }
        jobsCompleted: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              jobId: { type: string }
              reference: { type: string }
              amount: { type: integer }
              settledAt: { type: string, format: date-time }
    Invoice:
      type: object
      properties:
        jobId: { type: string }
        reference: { type: string }
        currency: { type: string, default: RWF }
        visitFee:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        repairTotal:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        total:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        lines:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              quantity: { type: integer }
              unitPrice: { type: integer }
              amount: { type: integer }
        issuedAt: { type: string, format: date-time }
    PageOfPayment:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Payment" } }
        nextCursor: { type: [string, "null"] }
    PresignRequest:
      type: object
      required: [purpose, fileName, contentType, sizeBytes]
      properties:
        purpose: { type: string, enum: [job-photo, job-video, profile-picture, technician-document] }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
    PresignResponse:
      type: object
      properties:
        uploadId: { type: string }
        uploadUrl: { type: string }
        method: { type: string, default: PUT }
        headers: { type: object, additionalProperties: { type: string } }
        expiresInSeconds: { type: integer }
    UploadCompleteRequest:
      type: object
      required: [uploadId, storageKey]
      properties:
        uploadId: { type: string }
        storageKey: { type: string }
