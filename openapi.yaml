          schema:
            maxLength: 200
            example: Kicukiro
            type: string
        - name: minYearsOfExperience
          required: true
          in: query
          description: Minimum years of experience, inclusive.
          schema:
            minimum: 0
            maximum: 60
            example: 3
            type: number
      responses:
