      tags:
        - Admin conversations
      x-fundi-status: implemented
  /admin/disputes:
    get:
      description: Returns the disputed jobs, newest first, filtered by state. Each job carries its `dispute` (reason, opener, and the resolution when decided).
      operationId: AdminDisputesController_list
      parameters:
        - name: state
